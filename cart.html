<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review the books in your My Bookstore cart before checkout.">
  <title>Cart - My Bookstore</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js?v=cover-images-20260606"></script>
</head>
<body>
  <header class="navbar glass">
    <a class="logo" href="index.html" aria-label="Go to home page">My Bookstore</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <button class="cart-toggle" id="cartToggle" type="button" aria-expanded="false" aria-controls="miniCartPanel" aria-label="Open cart">
        <span aria-hidden="true">&#128722;</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button id="darkModeToggle" type="button" aria-pressed="false">Dark</button>
    </div>
    <div class="mini-cart" id="miniCartPanel" hidden>
      <div class="mini-cart-head">
        <strong>Your Cart</strong>
        <a href="cart.html">View cart</a>
      </div>
      <div id="miniCartItems"></div>
      <div class="mini-cart-total" id="miniCartTotal">Total: $0.00</div>
      <a class="btn-primary" href="checkout.html">Checkout</a>
    </div>
  </header>

  <section class="cart page-shell">
    <div class="page-intro">
      <p class="eyebrow">Basket</p>
      <h1>Your Cart</h1>
      <p>Review your selected books before moving into checkout.</p>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total" id="cartTotal">Total: $0.00</div>
    <div class="cart-actions">
      <a class="btn-secondary" href="shop.html">Continue Shopping</a>
      <a class="btn-primary" id="checkoutLink" href="checkout.html">Checkout</a>
    </div>
  </section>

  <footer class="footer glass">
    <p>&copy; 2026 My Bookstore. All rights reserved.</p>
  </footer>
</body>
</html>
